name: Rigs of Rods Android port preflight

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-control-contract:
    name: Host-test normalized vehicle control contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run control contract tests
        run: |
          set -euxo pipefail
          c++ -std=c++17 -Wall -Wextra -Werror -I android/probe/app/src/main/cpp android/probe/app/src/main/cpp/vehicle_controls.cpp android/probe/app/src/test/cpp/vehicle_controls_test.cpp -o /tmp/vehicle_controls_test
          /tmp/vehicle_controls_test

  build-native-probe:
    name: Build ARM64 native Android probe (not the game)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK / NDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"
      - name: Compile diagnostic APK
        working-directory: android/probe
        run: gradle --no-daemon assembleDebug
      - name: Validate APK archive and ARM64 native library
        run: |
          set -euo pipefail
          APK=android/probe/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK"
          unzip -p "$APK" lib/arm64-v8a/libror_port_probe.so > /tmp/libror_port_probe.so
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -n "$NDK_DIR"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h /tmp/libror_port_probe.so > /tmp/ror-elf-header.txt
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -Ws /tmp/libror_port_probe.so > /tmp/ror-elf-symbols.txt
          grep -q 'AArch64' /tmp/ror-elf-header.txt
          grep -q 'android_main' /tmp/ror-elf-symbols.txt
          echo 'APK archive valid; native library is AArch64 and exports android_main.'
      - name: Install and smoke-test on ARM64 Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: arm64-v8a
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            adb install android/probe/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p org.rigsofrods.portprobe 1
            sleep 12
            adb logcat -d -s RoRPortProbe:I AndroidRuntime:E > /tmp/ror-probe-log.txt
            grep -q 'Started native Android OpenGL ES diagnostic' /tmp/ror-probe-log.txt
            grep -q 'OpenGL ES diagnostic surface' /tmp/ror-probe-log.txt
            if grep -q 'FATAL EXCEPTION' /tmp/ror-probe-log.txt; then cat /tmp/ror-probe-log.txt; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ror-android-native-probe-arm64-not-the-game
          path: android/probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-ogre-android:
    name: Build OGRE 1.11.6 for Android ARM64 (engine dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;28.2.13676358" "cmake;3.31.6"
      - uses: actions/checkout@v4
        with:
          repository: OGRECave/ogre
          ref: v1.11.6
          path: ogre-source
      - name: Configure OGRE for Android ARM64 and GLES2
        run: |
          set -euxo pipefail
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          cmake -S ogre-source -B ogre-build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_DIR/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/ogre-install" \
            -DOGRE_BUILD_RENDERSYSTEM_GLES2=ON \
            -DOGRE_BUILD_RENDERSYSTEM_GL=OFF \
            -DOGRE_BUILD_RENDERSYSTEM_GL3PLUS=OFF \
            -DOGRE_BUILD_SAMPLES=OFF \
            -DOGRE_BUILD_TESTS=OFF \
            -DOGRE_BUILD_TOOLS=OFF \
            -DOGRE_BUILD_COMPONENT_BITES=OFF \
            -DOGRE_BUILD_COMPONENT_CSHARP=OFF \
            -DOGRE_BUILD_COMPONENT_JAVA=OFF \
            -DOGRE_BUILD_COMPONENT_PYTHON=OFF \
            -DOGRE_BUILD_COMPONENT_OVERLAY=OFF \
            -DOGRE_BUILD_COMPONENT_TERRAIN=OFF \
            -DOGRE_BUILD_COMPONENT_PAGING=OFF \
            -DOGRE_BUILD_PLUGIN_PARTICLEFX=OFF
      - name: Patch OGRE UTF string aliases for modern Android libc++
        working-directory: ogre-source
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('OgreMain/include/OgreUTFString.h')
          s = p.read_text()
          old = ('typedef uint32 unicode_char;', 'typedef uint16 code_point;')
          new = ('typedef char32_t unicode_char;', 'typedef char16_t code_point;')
          for before, after in zip(old, new):
              if before not in s:
                  raise SystemExit(f'Expected upstream declaration missing: {before}')
              s = s.replace(before, after, 1)
          p.write_text(s)
          print('Patched UTF string code-unit aliases to standard char16_t/char32_t types.')

          # OGRE v1.11.6 ships a stale APKZipArchive translation unit whose
          # factory declarations/implementation are absent from this tag.
          # The Android port uses the standard APK filesystem archive instead;
          # leave this optional ZIP adapter out so the core engine can compile.
          apk_zip = Path('OgreMain/src/Android/OgreAPKZipArchive.cpp')
          if apk_zip.exists():
              apk_zip.write_text(
                  '// Disabled for this Android build: upstream v1.11.6 contains '
                  'an orphaned APKZipArchive implementation with no matching declarations.\\n'
              )
              print('Disabled orphaned optional APKZipArchive translation unit.')
          PY
      - name: Compile OGRE core and GLES2 renderer
        run: |
          set -euxo pipefail
          cmake --build ogre-build --target OgreMain RenderSystem_GLES2 --parallel 2
          cmake --install ogre-build
      - name: Archive OGRE ARM64 libraries and build report
        run: |
          mkdir -p artifacts
          cp -a ogre-install artifacts/ogre-install
          {
            echo "OGRE tag: v1.11.6"
            echo "ABI: arm64-v8a"
            echo "Renderer: GLES2"
            echo "This artifact contains OGRE libraries only; it is not a Rigs of Rods APK."
            find ogre-install -type f | sort
          } > artifacts/OGRE_ANDROID_BUILD_REPORT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ogre-1.11.6-android-arm64-libraries-not-game
          path: artifacts/
          if-no-files-found: error
